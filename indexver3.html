<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <a-scene embedded arjs="sourveType: webcam">
        <a-marker preset="hiro">
            <a-entity id="coin" rotation="270 0 0">
                <a-cylinder position="0 1.5 0" rotation="90 0 0" radius="0.7" height="0.3" color="gold" animation="property:rotation;
                    to:90 360 0;
                    loop:true;
                    easing:linear;"></a-cylinder>
                <a-cylinder height="0.3" material="src:#brick"></a-cylinder>
                <a-cylinder height="0.7" radius="0.7" material="src:#brick"></a-cylinder>
            </a-entity>


        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
