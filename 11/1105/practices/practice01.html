<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

</head>

<body>
    <a-scene hands id="scene">
        <a-gltf-model id="model" animation-mixer="clip: MagicCircle_Loop" src="../../../assets/glbs/c_cyan.glb"
            position="0 0.4 -3" scale="2 2 2" rotation="90 0 0"></a-gltf-model>

        <a-entity hand-anchor="index:8">
            <a-gltf-model id="cursor" src="../../../assets/glbs/cursor.glb" scale="0.07 0.07 0.07"
                position="0.15 -0.2 0.1" rotation="0 0 35"></a-gltf-model>
        </a-entity>

        <a-plane id="toAttackAnimationPanel" color="green" opacit="0.8" width="0.85" height="0.35" rotation="10 0 0"
            position="-0.9 1.3 -2"></a-plane>
        <a-text value="Attack" position="-0.9 1.3 -1.95" rotation="-10 0 0" align="center"></a-text>

        <a-plane id="toJumpAnimationPanel" color="black" opacit="0.8" width="0.9" height="0.35" rotation="10 0 0"
            position="0.3 1.3 -2"></a-plane>
        <a-text value="Jump" position="0.3 1.3 -1.95" rotation="-10 0 0" align="center"></a-text>

        <a-plane id="goldPanel" color="gold" opacity="0.8" width="0.9" height="0.35" rotation="-10 0 0"
            position="0.3 -0.8 -2"></a-plane>
        <a-text value="Gold" position="0.3 -0.8 -2" rotation="-10 0 0" align="center"></a-text>

        <a-plane id="cyanPanel" color="cyan" opacity="0.8" width="0.9" height="0.35" rotation="-10 0 0"
            position="-0.9 -0.8 -2"></a-plane>
        <a-text value="Cyan" position="-0.9 -0.8 -2" rotation="-10 0 0" align="center"></a-text>

        <a-plane id="summonPanel" color="gray" opacity="0.8" width="0.4" height="0.35" rotation="-10 0 0"
            position="1.2 -0.8 -2"></a-plane>
        <a-gltf-model id="model" src="../../../assets/glbs/c_cyan.glb" position="1.2 -0.8 -1.99" scale="0.4 0.4 0.4"
            rotation="80 0 0"></a-gltf-model>
        <a-plane id="reverseSummonPanel" color="red" opacity="0.8" width="0.4" height="0.35" rotation="-10 0 0"
            position="1.7 -0.8 -2"></a-plane>
        <a-gltf-model id="model" src="../../../assets/glbs/c_cyan.glb" position="1.7 -0.8 -1.99" scale="0.4 0.4 0.4"
            rotation="80 0 0"></a-gltf-model>
        <a-text value="/" position="1.69 -0.78 -1.98" rotation="-10 0 0" align="center" scale="3 2 2"
            color="red"></a-text>
    </a-scene>
    <a-camera positon="0 0 0"></a-camera>

    <script>
        const scene = document.getElementById("scene")
        const model = document.getElementById("model")
        const toAttackAnimationPanel = document.getElementById("toAttackAnimationPanel")
        const toJumpAnimationPanel = document.getElementById("toJumpAnimationPanel")
        const goldPanel = document.getElementById("goldPanel")
        const cyaPanel = document.getElementById("cyanPanel")
        const summonPanel = document.getElementById("summonPanel");
        const reverseSummonPanel = document.getElementById("reverseSummonPanel")
        let summoned = false;
        let summonedName = "Robot";

        const goldUrl = "../../../assets/glbs/c_gold.glb"
        const cyanUrl = "../../../assets/glbs/c_cyan.glb"

        let wasGoldInside = false;
        function toGold() {
            const inside = scene.components.hands.isPointOnEntity(8, goldPanel);

            if(summoned) return;

            if (inside && wasGoldInside) {
                model.setAttribute("src", goldUrl);

                summonedName = "Spider"
            }
            wasGoldInside = inside;
        }

        let wasCyanInside = false;
        function toCyan() {
            const inside = scene.components.hands.isPointOnEntity(8, cyanPanel);

            if(summoned) return;

            if (inside && wasCyanInside) {
                model.setAttribute("src", cyanUrl);

                summonedName = "Robot"
            }
            wasCyanInside = inside;
        }

        let wasSummonInside = false;
        async function toSummon() {
            if (summoned) return;
            const inside = scene.components.hands.isPointOnEntity(8, summonPanel);

            if (inside && wasSummonInside) {

                summoned = true;

                //from 1 to -0.7
                model.setAttribute("position", `0 1 -3`);
                model.setAttribute("rotation", `160 0 0`)

                for (let Y = 1; Y > -0.7; Y = Y - 0.1) {
                    await timeInterval(10);
                    await model.setAttribute("position", `0 ${Y} -3`);
                }

                switch (summonedName) {
                    case "Robot":
                        summonRobot();
                        break;
                    case "Spider":
                        summonSpider();
                        break;
                }

            }
            wasSummonInside = inside;

        }

        let wasReverseSummonInside = false;
        async function toReverseSummon() {
            if (!summoned) return;
            const inside = scene.components.hands.isPointOnEntity(8, reverseSummonPanel);

            if (inside && wasReverseSummonInside) {

                summoned = false;

                for (let Y = -0.7; Y < 1; Y = Y + 0.1) {
                    await timeInterval(10);
                    await model.setAttribute("position", `0 ${Y} -3`);
                }

                const reverseModel = document.getElementById("createdModel")
                reverseModel.remove();

                await timeInterval(1000);

                await model.setAttribute("position", `0 0.4 -3`);
                await model.setAttribute("rotation", `90 0 0`)

            }
            wasReverseSummonInside = inside;

        }

        let wasAttackAnimationInside = false;
        async function toAttackAnimation() {
            if (!summoned) return;
            const inside = scene.components.hands.isPointOnEntity(8, toAttackAnimationPanel);

            if (inside && wasAttackAnimationInside) {

                const summonedModel = document.getElementById("createdModel")
                if (!summonedModel) return;

                switch (summonedName) {
                    case "Robot":
                        summonedModel.setAttribute("animation-mixer", "clip:RobotArmature|Robot_Punch")
                        break;
                    case "Spider":
                        summonedModel.setAttribute("animation-mixer", "clip:SpiderArmature|Spider_Attack")
                        break;
                }
            }
            wasAttackAnimationInside = inside;
        }

        let wasJumpionInside = false;
        async function toJumpAnimation() {
            if (!summoned) return;
            const inside = scene.components.hands.isPointOnEntity(8, toJumpAnimationPanel);

            if (inside && wasJumpAnimationInside) {

                const summonedModel = document.getElementById("createdModel")
                if (!summonedModel) return;

                switch (summonedName) {
                    case "Robot":
                        summonedModel.setAttribute("animation-mixer", "clip:RobotArmature|Robot_Jump")
                        break;
                    case "Spider":
                        summonedModel.setAttribute("animation-mixer", "clip:SpiderArmature|Spider_Jump")
                        break;
                }
            }
            wasJumpAnimationInside = inside;
        }

        /*<a-gltf-model id="model" class="clickable" src="robot.glb" position="0 0 0" scale="0.5 0.5 0.5"
                    rotation="270 0 0" animation-mixer="clip:RobotArmature|Robot_Idle"></a-gltf-model>*/
        function summonRobot() {
            const createdModel = document.createElement("a-gltf-model")
            createdModel.setAttribute("id", "createdModel");
            createdModel.setAttribute("src", "../../../assets/glbs/robot.glb");
            createdModel.setAttribute("position", "0 -0.71 -3")
            createdModel.setAttribute("scale", "0.5 0.5 0.5");
            createdModel.setAttribute("rotation", "0 0 0")
            createdModel.setAttribute("animation-mixer", "clip:RobotArmature|Robot_Idle")

            scene.appendChild(createdModel);
        }
        function summonSpider() {
            const createdModel = document.createElement("a-gltf-model")
            createdModel.setAttribute("id", "createdModel");
            createdModel.setAttribute("src", "../../../assets/glbs/spider.glb");
            createdModel.setAttribute("position", "0 -0.75 -4")
            createdModel.setAttribute("scale", "0.5 0.5 0.5");
            createdModel.setAttribute("rotation", "0 0 0")
            createdModel.setAttribute("animation-mixer", "clip:SpiderArmature|Spider_Idle")

            scene.appendChild(createdModel);
        }

        function timeInterval(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        scene.addEventListener("hand-result", toAttackAnimation);
        scene.addEventListener("hand-result", toJumpAnimation);
        scene.addEventListener("hand-result", toGold)
        scene.addEventListener("hand-result", toCyan);
        scene.addEventListener("hand-result", toSummon)
        scene.addEventListener("hand-result", toReverseSummon);
        window.addEventListener("click", toSummon);
        window.addEventListener("click", toGold)

    </script>
</body>

</html>
