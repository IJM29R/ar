<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-sky color="skyblue"></a-sky>
        <a-plane rotation="-90 0 0" height="10" width="10" color=green></a-plane>
        <a-assets>
            <img src="/assets/images/brick.jpg" id="brick" alt="">
        </a-assets>
        <a-entity id="flowerbox">
            <a-box postion="0 1 0" width="3" material="src:#brick"></a-box>
            <a-plane position="0 0.5 0" rotation="-90 0 0" hight="9.5" width=3 color="brown"></a-plane>
            <a-entity id="flower">
                <a-cylinder position="1 1 0" radius="0.1" color="green"></a-cylinder>
                <a-cone position="1 1.5 0" rotation="180 0 0" height="0.5" radius-bottom="0.6" color="red"></a-cone>
                <a-sphere position="1 1.8 0" radius="0.3" color="yellow"></a-sphere>
            </a-entity>
            <a-entity id="flower" position="-2 0 0">
                <a-cylinder position="1 1 0" radius="0.1" color="green"></a-cylinder>
                <a-cone position="1 1.5 0" rotation="180 0 0" height="0.5" radius-bottom="0.6" color="red"></a-cone>
                <a-sphere position="1 1.8 0" radius="0.3" color="yellow"></a-sphere>
            </a-entity>
        </a-entity>

        <a-camera
        position="0 2 6"
        ></a-camera>
    </a-scene>
</body>
</html>
