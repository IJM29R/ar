<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.2.0/vr-kit.js"></script>
</head>
<style>
    #hud{
        position:fixed;
        top: 10px;
        left: 10px;
        z-index: 999;
        padding: 12px;
    }

    select{
        font-size: 18px;
        padding: 4px 8px;
        width: 200px;
    }
</style>
<body>
    <div id="hud">  
        <select name="" id="avatarChoice">
            <option value="robot">ロボット</option>
            <option value="wolf">狼</option>
        </select>
        <select name="" id="skyChoice">
            <option value="hiru">昼</option>
            <option value="yugata">夕方</option>
            <option value="yoru">夜</option>
        </select>
    </div>
    <a-scene>
        <a-sky color="lightblue" id="sky"></a-sky>
        <a-plane 
            rotation="-90 0 0" 
            width="30" 
            height="30"
            color="darkseagreen"
        ></a-plane>

        <a-entity
        id="avatar"
        gltf-model="../../assets/glbs/robot.glb"
        position="0 0 -3"
        scale="0.3 0.3 0.3"
        avatar="
        view:third;
        avatarDirection:180;
        walk:RobotArmature|Robot_Walking;
        idle:RobotArmature|Robot_Idle;"
        ></a-entity>

        <a-box color="gold" position="0 2 0"></a-box>
        <a-box color="gold" position="15 2 0"></a-box>
        <a-box color="gold" position="-15 2 0"></a-box>
        <a-box color="gold" position="0 2 15"></a-box>
        <a-box color="gold" position="0 2 -15"></a-box>
    </a-scene>

    <script>
        const avatar = document.getElementById("avatar");
        const avatarChoice = document.getElementById("avatarChoice");
        const skyChoice = document.getElementById("skyChoice");
        const sky = document.getElementById("sky");

        function changeAvatar(){
            switch(avatarChoice.value){
                case "wolf":
                    avatar.setAttribute("gltf-model" , "../../assets/glbs/wolf.glb");
                    avatar.setAttribute("scale","0.5 0.5 0.5");
                    avatar.setAttribute(
                        "avatar-motion",{
                            walk: "Walk",
                            idle: "Idle"
                        })
                break;

                case "robot":
                    avatar.setAttribute("gltf-model" , "../../assets/glbs/robot.glb");
                    avatar.setAttribute("scale","0.3 0.3 0.3");
                    avatar.setAttribute(
                        "avatar-motion",{
                            walk: "RobotArmature|Robot_Walking",
                            idle: "RobotArmature|Robot_Idle"
                        })
                break;
            }
        }

        function changeSky(){
            switch(skyChoice.value){
                case "hiru":
                    sky.setAttribute("color","skyblue");
                break;
                case "yugata":
                    sky.setAttribute("color","orange");
                break;
                case "yoru":
                    sky.setAttribute("color","black");
                break;
            }
        }

        avatarChoice.addEventListener("change" , changeAvatar)
        skyChoice.addEventListener("change", changeSky);
    </script>
</body>

</html>
