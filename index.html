<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-sky color="skyblue"></a-sky>
        <a-plane rotation="-90 0 0" color="green" height="10" width="10"></a-plane>
        <a-entity id="snowman" position="0 0.8 0">
            <a-sphere position="0 1.5 0" color="white" radius="0.7"></a-sphere>
            <a-sphere position="0 0 0" color="white" ></a-sphere>
            <a-box position="0 1.2 0.3" height="0.1" width="0.6" color="black"></a-box>
            <a-sphere position="0.2 1.5 0.7" radius="0.1" color="black"></a-sphere>
            <a-sphere position="-0.2 1.5 0.7" radius="0.1" color="black"></a-sphere>  
            <a-cone position="0 1 0" color="red"></a-cone> 
            <a-cone position="0 2.28 0" radius-bottom = 0.5 radius-top="0.3" height="0.5" color="yellow"></a-cone>     
        </a-entity>
        <a-entity id="dorm">
            <a-cylinder height="0.3" radius="4" color="white"></a-cylinder>
            <a-sphere radius="4" material="opacity:0.5"></a-sphere>
        </a-entity>
        <a-entity id="wood" position="1.5 0 2">
            <a-cylinder position="0 0 0" radius="0.2" height="1.5" color="brown"></a-cylinder>
            <a-sphere position="0 1.5 0" color="green" radius="1" scale="0.5 1 0.5"></a-sphere>
        </a-entity>
        <a-entity id="wood" position="-1.5 0 -2">
            <a-cylinder position="0 0 0" radius="0.3" height="1.5" color="brown"></a-cylinder>
            <a-sphere position="0 1.5 0" color="green" radius="1"></a-sphere>
        </a-entity>
        
        

        <a-camera
        position="0 2 6"
        ></a-camera>
    </a-scene>
</body>
</html>
